# Runs the public "Try it" flow once a day, so a broken hosted demo shows up as a failed run (and an email)
# before a judge finds it: the run must reach the payout and print "Done". Each run is a few testnet transactions.
name: daily-try
on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:
permissions: {}
jobs:
  try:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wake the host
        run: curl -fsS -m 120 --retry 3 https://kuasa-live.onrender.com/health
      - name: Run the parametric claim end to end
        run: |
          curl -sN -m 600 -X POST -H "Origin: https://kuasa-explorer.vercel.app" https://kuasa-live.onrender.com/try | tee run.txt
          grep -q "paid to the agent" run.txt
          grep -q "Done" run.txt
