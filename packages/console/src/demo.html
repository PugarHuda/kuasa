<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kuasa Cover Demo</title>
<style>
  :root { --bg: #0f1216; --panel: #171b21; --ink: #eef0f2; --muted: #9aa3ad; --line: #262c34; --ok: #5fd39a; --ok-bg: #143026; --bad: #ff8a80; --bad-bg: #3a1d1b; --warn: #f2c25b; --warn-bg: #352a12; --accent: #7aa2ff; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 18px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; display: flex; flex-direction: column; }
  header { display: flex; align-items: baseline; gap: 16px; padding: 22px 40px 0; }
  header h1 { margin: 0; font-size: 26px; letter-spacing: -0.01em; }
  header .tag { color: var(--muted); font-size: 16px; }
  header .count { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }
  main { flex: 1; display: grid; grid-template-columns: 1fr 1.15fr; gap: 32px; padding: 26px 40px; min-height: 0; }
  .story h2 { font-size: 34px; line-height: 1.2; margin: 0 0 18px; letter-spacing: -0.015em; }
  .story p { color: #c9ced4; font-size: 20px; margin: 0; }
  .steps { list-style: none; padding: 0; margin: 28px 0 0; display: grid; gap: 6px; }
  .steps li { color: var(--muted); font-size: 15px; }
  .steps li.on { color: var(--ink); font-weight: 600; }
  .steps li.done::before { content: '✓ '; color: var(--ok); }
  .result { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 26px 28px; overflow: auto; }
  .pill { display: inline-block; font-size: 15px; padding: 3px 12px; border-radius: 999px; font-weight: 700; }
  .pill.ai { background: #1d2547; color: var(--accent); }
  .trace { margin-top: 14px; display: grid; gap: 8px; font-size: 16px; max-height: 470px; overflow: auto; }
  .t-tool { color: var(--accent); } .t-res { padding-left: 18px; color: #c9ced4; } .t-say { color: var(--ink); font-style: italic; border-left: 3px solid var(--accent); padding-left: 10px; }
  .yes { color: var(--ok); font-weight: 700; } .no { color: var(--bad); font-weight: 700; }
  .pill.ok { background: var(--ok-bg); color: var(--ok); } .pill.bad { background: var(--bad-bg); color: var(--bad); } .pill.warn { background: var(--warn-bg); color: var(--warn); }
  .big { font-size: 30px; font-weight: 700; margin: 12px 0 4px; }
  .muted { color: var(--muted); }
  ul.reasons { margin: 12px 0 0; padding-left: 22px; color: var(--bad); }
  table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 16px; }
  td { padding: 6px 0; border-top: 1px solid var(--line); vertical-align: top; }
  td.m { text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; white-space: nowrap; padding-left: 16px; }
  .mono { font-family: ui-monospace, "Cascadia Code", Menlo, monospace; font-size: 15px; }
  a { color: var(--accent); text-decoration: none; }
  dl { display: grid; grid-template-columns: 170px 1fr; gap: 8px 16px; margin: 16px 0 0; font-size: 17px; }
  dt { color: var(--muted); } dd { margin: 0; overflow-wrap: anywhere; }
  footer { display: flex; gap: 12px; align-items: center; padding: 0 40px 26px; }
  button { font: inherit; font-size: 17px; padding: 10px 20px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; }
  button.primary { background: var(--accent); color: #0b1020; border-color: var(--accent); font-weight: 700; }
  button.approve { background: var(--ok); color: #06180f; border-color: var(--ok); font-weight: 700; font-size: 20px; padding: 14px 26px; }
  button:disabled { opacity: .45; cursor: default; }
  .spin { display: inline-block; width: 18px; height: 18px; border: 3px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: s 0.9s linear infinite; vertical-align: -3px; margin-right: 10px; }
  @keyframes s { to { transform: rotate(360deg); } }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } header, main, footer { padding-left: 16px; padding-right: 16px; } }
</style>
</head>
<body>
<header><h1>Kuasa Cover</h1><span class="tag">insurance for AI agent commerce · live on Concordium testnet</span><span class="count" id="count"></span></header>
<main>
  <section class="story"><h2 id="title">Loading…</h2><p id="caption"></p><ul class="steps" id="steps"></ul></section>
  <section class="result" id="result"><span class="muted">Press “Run” (or →) to play each step against testnet.</span></section>
</main>
<footer><button id="prev">←</button><button class="primary" id="run">Run</button><button id="next">Next →</button><span class="muted" id="status"></span></footer>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const hex = (h) => /^[0-9a-f]{64}$/i.test(h ?? '') ? h : '';
const eur = (v) => (Number(v) / 1e6).toLocaleString(undefined, { maximumFractionDigits: 4 }) + ' EUDemo';
const tx = (h) => hex(h) ? `<a class="mono" target="_blank" rel="noopener" href="https://ccdexplorer.io/testnet/transaction/${hex(h)}">${h.slice(0, 10)}…${h.slice(-6)} ↗</a>` : '–';
let steps = [], i = 0;
const done = new Set();

function summarize(text) {
  let j; try { j = JSON.parse(text); } catch { return esc(text.slice(0, 140)); }
  if (Array.isArray(j)) return j.length + ' purchase(s): ' + j.map((p) => esc(p.item) + ' ' + eur(p.amount) + ' ' + tx(p.paymentTx)).join(' · ');
  if (j.ok === false || j.refused) return '<span class="no">✗ ' + esc(j.refused || (j.reasons || []).join('; ').replace(/^answered 402: /, '')) + '</span>';
  if (j.policy) return '<span class="yes">✓ insured: policy #' + esc(j.policy.policyId) + ', premium ' + eur(j.premium) + '</span> ' + tx(j.paymentTx);
  if (j.claimId !== undefined && j.assessment) return '<span class="yes">✓ claim #' + esc(j.claimId) + ' filed</span> ' + tx(j.tx) + (j.assessment.ok !== undefined ? ' · assessor: ' + esc(j.assessment.reason) + (j.assessment.ok ? ', recommend ' + eur(j.assessment.payout) : '') : '');
  if (j.quoteId) return 'quote: ' + eur(j.premium) + ' (' + (j.factors || []).map((f) => esc(f.name) + ' ×' + f.multiplier).join(', ') + ')';
  if (j.ok && j.paymentTx) return '<span class="yes">✓ paid</span> ' + tx(j.paymentTx);
  if (j.reasons) return '<span class="no">' + esc(j.reasons.join('; ')) + '</span>';
  return esc(text.slice(0, 140));
}
function traceHtml(t) {
  const rows = t.events.map((e) => e.kind === 'tool' ? '<div class="t-tool">→ <b>' + esc(e.name) + '</b> <span class="mono">' + esc(JSON.stringify(e.input).slice(0, 90)) + '</span></div>'
    : e.kind === 'result' ? '<div class="t-res">' + summarize(e.text) + '</div>'
    : e.kind === 'say' ? '<div class="t-say">“' + esc(e.text) + '”</div>' : '').join('');
  return '<span class="pill ai">Claude · Kuasa MCP tools only</span><div class="trace">' + (rows || '<span class="muted">starting the agent…</span>') + '</div>';
}
const refused = (r, note) => `<span class="pill bad">Refused before payment</span><div class="big">No money moved</div>
  <ul class="reasons">${(r.reasons || []).map((x) => `<li>${esc(x.replace(/^answered 402: /, ''))}</li>`).join('')}</ul>${note ? `<p class="muted">${esc(note)}</p>` : ''}`;

const render = {
  'ai-shop': (r) => traceHtml(r),
  'ai-claim': (r) => traceHtml(r),
  teen: (r) => r.ok ? '<span class="pill warn">Unexpectedly allowed</span>' : refused(r, 'Zero-knowledge: the shop learns only that the 18+ proof is missing.'),
  publish: (r) => r.tx ? `<span class="pill ok">Published</span><div class="big">kuasa:cover on CIS-8004</div><dl><dt>Value</dt><dd class="mono">${esc(r.value)}</dd><dt>Transaction</dt><dd>${tx(r.tx)}</dd></dl>` : `<span class="pill bad">${esc(r.error)}</span>`,
  bug: (r) => r.ok ? `<span class="pill warn">Simulated retry bug</span><div class="big">Charged twice for one bottle</div><dl><dt>Duplicate payment</dt><dd>${tx(r.paymentTx)}</dd><dt>Amount</dt><dd>24 EUDemo, fee sponsored by the shop</dd></dl>` : refused(r),
  approve: (r) => r.paid ? `<span class="pill ok">Paid</span><div class="big">${eur(r.amount)} back to the agent</div><dl><dt>Decided by</dt><dd>human claims handler</dd><dt>Payout tx</dt><dd>${tx(r.paid)}</dd><dt>On-chain</dt><dd>claim Paid · policy paidOut updated</dd></dl>` : `<span class="pill warn">${esc(r.reason || r.error || 'pending')}</span>`,
  evm: (r) => { const a = r.answer || {}; const ag = a.concordiumAgent || {}; return `<span class="pill ${a.insured ? 'ok' : 'bad'}">${a.insured ? 'Insured by Kuasa Cover' : 'Not insured'}</span> <span class="pill ${a.badgeValid ? 'ok' : 'bad'}">Verified by Concordium: ${a.badgeValid ? 'valid' : 'invalid'}</span>
    <dl><dt>EVM agent</dt><dd class="mono">${esc(a.evmAddress)}</dd><dt>Signed</dt><dd class="mono">${esc(String(r.message).replace(/:([0-9a-f]{32}):/, ':…:'))}</dd><dt>Concordium agent</dt><dd class="mono">${esc(ag.tokenAddress)} · ${esc(ag.status)}</dd><dt>Cover</dt><dd>${a.cover ? 'policy #' + esc(a.cover.policyId) + ', ' + eur(a.cover.periodRemaining) + ' left' : '–'}</dd><dt>Claims history</dt><dd>${a.risk ? esc(a.risk.paidClaims) + ' paid · premium ×' + esc(a.risk.premiumMultiplier) : '–'}</dd><dt>Answered by</dt><dd class="mono">${esc(r.endpoint)}</dd></dl>`; },
  proof: (r) => { const s = r.solvency || {}; return `<span class="pill ${r.badge.badgeValid ? 'ok' : 'bad'}">Verified by Concordium: ${r.badge.badgeValid ? 'valid' : 'invalid'}</span> <span class="pill ${s.solvent ? 'ok' : 'bad'}">${s.solvent ? 'Solvent' : 'Under-reserved'}</span>
    <dl><dt>Pool</dt><dd>${eur(s.pool)}</dd><dt>Live exposure</dt><dd>${eur(s.exposure)} across ${esc(s.livePolicies)} policies · coverage ×${esc(s.coverage)}</dd><dt>Premiums / paid out</dt><dd>${eur(s.premiums)} / ${eur(s.paidOut)}</dd>
    <dt>Badge</dt><dd class="mono">${esc(r.badge.tokenAddress)}</dd><dt>Agent Card</dt><dd><a href="${esc(r.badge.agentUri)}" target="_blank" rel="noopener">${esc(r.badge.agentUri)}</a></dd>
    <dt>Evidence</dt><dd><a href="https://github.com/PugarHuda/kuasa/blob/main/docs/TESTNET.md" target="_blank" rel="noopener">docs/TESTNET.md</a> · github.com/PugarHuda/kuasa</dd></dl>`; },
};

function show() {
  const s = steps[i];
  $('title').textContent = s.title;
  $('caption').textContent = s.caption;
  $('count').textContent = `${i + 1} / ${steps.length}`;
  $('steps').innerHTML = steps.map((x, k) => `<li class="${k === i ? 'on' : ''} ${done.has(x.id) ? 'done' : ''}">${esc(x.title)}</li>`).join('');
  $('run').disabled = !(s.runnable || s.id === 'approve');
  $('run').textContent = s.id === 'approve' ? 'Show claim' : 'Run';
  if (!done.has(s.id)) $('result').innerHTML = s.id === 'intro' ? `<div class="big">Owner verifies once → an AI agent shops under a mandate → it insures itself → its mistakes are paid from on-chain evidence: small ones automatically, big ones after a human approves.</div>` : '<span class="muted">Ready.</span>';
}

async function run() {
  const s = steps[i];
  $('run').disabled = true;
  $('status').innerHTML = '<span class="spin"></span>running on Concordium testnet…';
  try {
    if (s.id === 'approve') {
      const c0 = ((await (await fetch('/api/cover')).json()).claims || []).filter((x) => x.assessment.ok && !x.verdict).pop();
      const lim = (await (await fetch('/api/solvency')).json()).autoPayLimit;
      $('result').innerHTML = `<span class="pill warn">Awaiting your decision</span><div class="big">Claim #${esc(c0 ? c0.claimId : '?')}: duplicate order, recommend ${c0 ? eur(c0.assessment.payout) : '?'}</div><p class="muted">Auto-pay limit is ${eur(lim)}: smaller claims pay automatically after an objection window. This one is above it, so nothing is paid without a human.</p><button class="approve" id="approveBtn">Approve &amp; pay</button>`;
      $('approveBtn').onclick = async () => {
        $('approveBtn').disabled = true;
        $('status').innerHTML = '<span class="spin"></span>paying out from the pool…';
        const claims = await (await fetch('/api/cover')).json();
        const c = (claims.claims || []).filter((x) => x.assessment.ok && !x.verdict).pop();
        if (!c) { $('result').innerHTML = render.approve({ error: 'no claim awaiting a decision' }); $('status').textContent = ''; return; }
        const r = await (await fetch(`/api/claims/${c.claimId}/decision/approve`, { method: 'POST', headers: { 'x-kuasa-console': '1' } })).json();
        done.add('approve'); $('result').innerHTML = render.approve({ ...r, amount: c.assessment.payout }); $('status').textContent = ''; show2();
      };
      $('status').textContent = '';
      return;
    }
    let poll;
    if (s.ai) poll = setInterval(async () => { $('result').innerHTML = traceHtml(await (await fetch('/api/demo/trace')).json()); const el = document.querySelector('.trace'); if (el) el.scrollTop = el.scrollHeight; }, 1000);
    const r = await (await fetch(`/api/demo/${s.id}`, { method: 'POST', headers: { 'x-kuasa-console': '1' } })).json().finally(() => clearInterval(poll));
    done.add(s.id);
    $('result').innerHTML = r.ok ? render[s.id](r.result) : `<span class="pill bad">${esc(r.error)}</span>`;
  } catch (e) {
    $('result').innerHTML = `<span class="pill bad">${esc(e.message)}</span>`;
  } finally {
    $('status').textContent = '';
    show2();
  }
}
function show2() { $('steps').innerHTML = steps.map((x, k) => `<li class="${k === i ? 'on' : ''} ${done.has(x.id) ? 'done' : ''}">${esc(x.title)}</li>`).join(''); $('run').disabled = !(steps[i].runnable || steps[i].id === 'approve') || done.has(steps[i].id); }

$('run').onclick = run;
$('next').onclick = () => { if (i < steps.length - 1) { i++; show(); } };
$('prev').onclick = () => { if (i > 0) { i--; show(); } };
document.addEventListener('keydown', (e) => { if (e.key === 'ArrowRight') $('next').click(); if (e.key === 'ArrowLeft') $('prev').click(); if (e.key === 'Enter') $('run').click(); });
fetch('/api/demo/steps').then((r) => r.json()).then((s) => { steps = s; show(); });
</script>
</body>
</html>
