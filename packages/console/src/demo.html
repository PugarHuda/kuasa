<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kuasa Cover Demo</title>
<style>
  :root { --bg: #0f1216; --panel: #171b21; --ink: #eef0f2; --muted: #9aa3ad; --line: #262c34; --ok: #5fd39a; --ok-bg: #143026; --bad: #ff8a80; --bad-bg: #3a1d1b; --warn: #f2c25b; --warn-bg: #352a12; --accent: #7aa2ff; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 18px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; display: flex; flex-direction: column; }
  header { display: flex; align-items: baseline; gap: 16px; padding: 22px 40px 0; }
  header h1 { margin: 0; font-size: 26px; letter-spacing: -0.01em; }
  header .tag { color: var(--muted); font-size: 16px; }
  header .count { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }
  main { flex: 1; display: grid; grid-template-columns: 1fr 1.15fr; gap: 32px; padding: 26px 40px; min-height: 0; }
  .story h2 { font-size: 34px; line-height: 1.2; margin: 0 0 18px; letter-spacing: -0.015em; }
  .story p { color: #c9ced4; font-size: 20px; margin: 0; }
  .steps { list-style: none; padding: 0; margin: 28px 0 0; display: grid; gap: 6px; }
  .steps li { color: var(--muted); font-size: 15px; }
  .steps li.on { color: var(--ink); font-weight: 600; }
  .steps li.done::before { content: '✓ '; color: var(--ok); }
  .result { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 26px 28px; overflow: auto; }
  .pill { display: inline-block; font-size: 15px; padding: 3px 12px; border-radius: 999px; font-weight: 700; }
  .pill.ok { background: var(--ok-bg); color: var(--ok); } .pill.bad { background: var(--bad-bg); color: var(--bad); } .pill.warn { background: var(--warn-bg); color: var(--warn); }
  .big { font-size: 30px; font-weight: 700; margin: 12px 0 4px; }
  .muted { color: var(--muted); }
  ul.reasons { margin: 12px 0 0; padding-left: 22px; color: var(--bad); }
  table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 16px; }
  td { padding: 6px 0; border-top: 1px solid var(--line); vertical-align: top; }
  td.m { text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; white-space: nowrap; padding-left: 16px; }
  .mono { font-family: ui-monospace, "Cascadia Code", Menlo, monospace; font-size: 15px; }
  a { color: var(--accent); text-decoration: none; }
  dl { display: grid; grid-template-columns: 170px 1fr; gap: 8px 16px; margin: 16px 0 0; font-size: 17px; }
  dt { color: var(--muted); } dd { margin: 0; overflow-wrap: anywhere; }
  footer { display: flex; gap: 12px; align-items: center; padding: 0 40px 26px; }
  button { font: inherit; font-size: 17px; padding: 10px 20px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; }
  button.primary { background: var(--accent); color: #0b1020; border-color: var(--accent); font-weight: 700; }
  button.approve { background: var(--ok); color: #06180f; border-color: var(--ok); font-weight: 700; font-size: 20px; padding: 14px 26px; }
  button:disabled { opacity: .45; cursor: default; }
  .spin { display: inline-block; width: 18px; height: 18px; border: 3px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: s 0.9s linear infinite; vertical-align: -3px; margin-right: 10px; }
  @keyframes s { to { transform: rotate(360deg); } }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } header, main, footer { padding-left: 16px; padding-right: 16px; } }
</style>
</head>
<body>
<header><h1>Kuasa Cover</h1><span class="tag">insurance for AI agent commerce · live on Concordium testnet</span><span class="count" id="count"></span></header>
<main>
  <section class="story"><h2 id="title">Loading…</h2><p id="caption"></p><ul class="steps" id="steps"></ul></section>
  <section class="result" id="result"><span class="muted">Press “Run” (or →) to play each step against testnet.</span></section>
</main>
<footer><button id="prev">←</button><button class="primary" id="run">Run</button><button id="next">Next →</button><span class="muted" id="status"></span></footer>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const hex = (h) => /^[0-9a-f]{64}$/i.test(h ?? '') ? h : '';
const eur = (v) => (Number(v) / 1e6).toLocaleString(undefined, { maximumFractionDigits: 4 }) + ' EUDemo';
const tx = (h) => hex(h) ? `<a class="mono" target="_blank" rel="noopener" href="https://ccdexplorer.io/testnet/transaction/${hex(h)}">${h.slice(0, 10)}…${h.slice(-6)} ↗</a>` : '–';
let steps = [], i = 0;
const done = new Set();

function reasonsOf(r) { return (r && r.reasons) || []; }
const refused = (r, note) => `<span class="pill bad">Refused before payment</span><div class="big">No money moved</div>
  <ul class="reasons">${reasonsOf(r).map((x) => `<li>${esc(x.replace(/^answered 402: /, ''))}</li>`).join('')}</ul>${note ? `<p class="muted">${esc(note)}</p>` : ''}`;

const render = {
  uninsured: (r) => r.ok ? `<span class="pill warn">Unexpectedly allowed</span>` : refused(r, 'Kuasa guard: mandate ✓ · owner proof 18+/EU ✓ · CIS-8004 agent ✓ · cover ✗'),
  teen: (r) => r.ok ? `<span class="pill warn">Unexpectedly allowed</span>` : refused(r, 'Zero-knowledge: the shop learns only that the 18+ proof is missing.'),
  quote: (r) => r.refused ? `<span class="pill bad">${esc(r.refused)}</span>` : `<span class="pill ok">Quote</span><div class="big">${eur(r.premium)} for 100 EUDemo · 30 days</div>
    <table>${(r.factors || []).map((f) => `<tr><td>${esc(f.name)}<br><span class="muted">${esc(f.reason)}</span></td><td class="m">×${esc(f.multiplier)}</td></tr>`).join('')}</table>`,
  cover: (r) => r.ok ? `<span class="pill ok">Insured</span><div class="big">Policy #${esc(r.policy.policyId)}</div>
    <dl><dt>Premium</dt><dd>${eur(r.premium)} paid over x402</dd><dt>Premium tx</dt><dd>${tx(r.paymentTx)}</dd><dt>Cover</dt><dd>${eur(r.policy.limit)} until ${new Date(Number(r.policy.until)).toLocaleDateString()}</dd><dt>Contract</dt><dd class="mono">kuasa-cover &lt;13066,0&gt;</dd></dl>` : refused(r),
  publish: (r) => r.tx ? `<span class="pill ok">Published</span><div class="big">kuasa:cover on CIS-8004</div><dl><dt>Value</dt><dd class="mono">${esc(r.value)}</dd><dt>Transaction</dt><dd>${tx(r.tx)}</dd></dl>` : `<span class="pill bad">${esc(r.error)}</span>`,
  mistake: (r) => `<span class="pill warn">Agent mistake</span><div class="big">Same wine, bought twice</div>
    <dl><dt>Payment 1</dt><dd>${r.first.ok ? tx(r.first.paymentTx) : esc(reasonsOf(r.first).join('; '))}</dd><dt>Payment 2</dt><dd>${r.second.ok ? tx(r.second.paymentTx) : esc(reasonsOf(r.second).join('; '))}</dd><dt>Asset</dt><dd>24 EUDemo each, fees sponsored by the shop</dd></dl>`,
  claim: (r) => r.assessment && r.assessment.ok !== undefined ? `<span class="pill ${r.assessment.ok ? 'ok' : 'bad'}">Assessed</span><div class="big">Claim #${esc(r.claimId)}: ${r.assessment.ok ? 'recommend ' + eur(r.assessment.payout) : 'not covered'}</div>
    <dl><dt>Assessor</dt><dd>${esc(r.assessment.reason)}</dd><dt>Filed (sponsored)</dt><dd>${tx(r.tx)}</dd><dt>Payout</dt><dd>waits for a human decision</dd></dl>` : `<span class="pill bad">${esc(r.error || JSON.stringify(r))}</span>`,
  approve: (r) => r.paid ? `<span class="pill ok">Paid</span><div class="big">${eur(r.amount ?? 23000000)} to the agent</div><dl><dt>Payout tx</dt><dd>${tx(r.paid)}</dd><dt>On-chain</dt><dd>claim Paid · policy paidOut updated · claimsAuthorized = false</dd></dl>` : `<span class="pill warn">${esc(r.reason || r.error || 'pending')}</span>`,
  proof: (r) => `<span class="pill ${r.badge.badgeValid ? 'ok' : 'bad'}">Verified by Concordium: ${r.badge.badgeValid ? 'valid' : 'invalid'}</span>
    <dl><dt>Badge</dt><dd class="mono">${esc(r.badge.tokenAddress)}</dd><dt>Agent Card</dt><dd><a href="${esc(r.badge.agentUri)}" target="_blank" rel="noopener">${esc(r.badge.agentUri)}</a></dd>
    <dt>Contracts</dt><dd class="mono">kuasa-registry &lt;13065,0&gt; · kuasa-cover &lt;13066,0&gt; · CIS-8004 &lt;12802,0&gt;</dd>
    <dt>Evidence</dt><dd><a href="https://github.com/PugarHuda/kuasa/blob/main/docs/TESTNET.md" target="_blank" rel="noopener">docs/TESTNET.md</a> · <a href="https://github.com/PugarHuda/kuasa" target="_blank" rel="noopener">github.com/PugarHuda/kuasa</a></dd></dl>`,
};

function show() {
  const s = steps[i];
  $('title').textContent = s.title;
  $('caption').textContent = s.caption;
  $('count').textContent = `${i + 1} / ${steps.length}`;
  $('steps').innerHTML = steps.map((x, k) => `<li class="${k === i ? 'on' : ''} ${done.has(x.id) ? 'done' : ''}">${esc(x.title)}</li>`).join('');
  $('run').disabled = !(s.runnable || s.id === 'approve');
  $('run').textContent = s.id === 'approve' ? 'Show claim' : 'Run';
  if (!done.has(s.id)) $('result').innerHTML = s.id === 'intro' ? `<div class="big">Owner verifies once → agent shops under a mandate → agent insures itself → mistakes are paid from on-chain evidence, after a human approves.</div>` : '<span class="muted">Ready.</span>';
}

async function run() {
  const s = steps[i];
  $('run').disabled = true;
  $('status').innerHTML = '<span class="spin"></span>running on Concordium testnet…';
  try {
    if (s.id === 'approve') {
      $('result').innerHTML = `<span class="pill warn">Awaiting your decision</span><div class="big">Claim: duplicate order, recommend 23 EUDemo</div><p class="muted">The assessor only recommends. Nothing is paid without a human.</p><button class="approve" id="approveBtn">Approve &amp; pay</button>`;
      $('approveBtn').onclick = async () => {
        $('approveBtn').disabled = true;
        $('status').innerHTML = '<span class="spin"></span>paying out from the pool…';
        const claims = await (await fetch('/api/cover')).json();
        const c = (claims.claims || []).filter((x) => x.assessment.ok && !x.verdict).pop();
        if (!c) { $('result').innerHTML = render.approve({ error: 'no claim awaiting a decision' }); $('status').textContent = ''; return; }
        const r = await (await fetch(`/api/claims/${c.claimId}/decision/approve`, { method: 'POST', headers: { 'x-kuasa-console': '1' } })).json();
        done.add('approve'); $('result').innerHTML = render.approve({ ...r, amount: c.assessment.payout }); $('status').textContent = ''; show2();
      };
      $('status').textContent = '';
      return;
    }
    const r = await (await fetch(`/api/demo/${s.id}`, { method: 'POST', headers: { 'x-kuasa-console': '1' } })).json();
    done.add(s.id);
    $('result').innerHTML = r.ok ? render[s.id](r.result) : `<span class="pill bad">${esc(r.error)}</span>`;
  } catch (e) {
    $('result').innerHTML = `<span class="pill bad">${esc(e.message)}</span>`;
  } finally {
    $('status').textContent = '';
    show2();
  }
}
function show2() { $('steps').innerHTML = steps.map((x, k) => `<li class="${k === i ? 'on' : ''} ${done.has(x.id) ? 'done' : ''}">${esc(x.title)}</li>`).join(''); $('run').disabled = !(steps[i].runnable || steps[i].id === 'approve') || done.has(steps[i].id); }

$('run').onclick = run;
$('next').onclick = () => { if (i < steps.length - 1) { i++; show(); } };
$('prev').onclick = () => { if (i > 0) { i--; show(); } };
document.addEventListener('keydown', (e) => { if (e.key === 'ArrowRight') $('next').click(); if (e.key === 'ArrowLeft') $('prev').click(); if (e.key === 'Enter') $('run').click(); });
fetch('/api/demo/steps').then((r) => r.json()).then((s) => { steps = s; show(); });
</script>
</body>
</html>
