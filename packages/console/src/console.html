<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kuasa Console</title>
<style>
  :root {
    --bg: #f6f5f1; --panel: #ffffff; --ink: #1b1d1f; --muted: #6b6f75; --line: #e4e2dc;
    --ok: #1f7a4d; --ok-bg: #e7f4ec; --bad: #b3261e; --bad-bg: #fbeae8; --warn: #8a5a00; --warn-bg: #fdf3dc;
    --accent: #1c4fd8;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121416; --panel: #1b1e21; --ink: #e8e8e6; --muted: #9a9ea4; --line: #2c3035;
      --ok: #5fd39a; --ok-bg: #16302a; --bad: #ff8a80; --bad-bg: #3a1d1b; --warn: #f2c25b; --warn-bg: #352a12; --accent: #7aa2ff; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { padding: 20px 24px 8px; display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  h1 { font-size: 20px; margin: 0; letter-spacing: -0.01em; }
  header .sub { color: var(--muted); }
  main { padding: 8px 24px 32px; display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); max-width: 1280px; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; min-width: 0; }
  section h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 12px; font-weight: 600; }
  .card { border-top: 1px solid var(--line); padding: 14px 0; }
  .card:first-of-type { border-top: 0; padding-top: 0; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .name { font-size: 16px; font-weight: 600; }
  .pill { font-size: 12px; padding: 2px 9px; border-radius: 999px; font-weight: 600; }
  .pill.ok { background: var(--ok-bg); color: var(--ok); } .pill.bad { background: var(--bad-bg); color: var(--bad); } .pill.warn { background: var(--warn-bg); color: var(--warn); }
  dl { display: grid; grid-template-columns: 120px 1fr; gap: 4px 12px; margin: 10px 0; }
  dt { color: var(--muted); } dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
  .bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-top: 6px; }
  .bar > i { display: block; height: 100%; background: var(--accent); }
  code, .mono { font-family: ui-monospace, "Cascadia Code", Menlo, monospace; font-size: 12px; }
  a { color: var(--accent); text-decoration: none; } a:hover { text-decoration: underline; }
  button { font: inherit; padding: 6px 12px; border-radius: 7px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; }
  button.danger { border-color: var(--bad); color: var(--bad); }
  button:disabled { opacity: .5; cursor: default; }
  .feed { list-style: none; margin: 0; padding: 0; }
  .feed li { border-top: 1px solid var(--line); padding: 10px 0; display: grid; grid-template-columns: 64px 1fr; gap: 10px; }
  .feed li:first-child { border-top: 0; }
  .muted { color: var(--muted); }
  .reasons { margin: 4px 0 0; padding-left: 18px; color: var(--bad); }
  .feed .reasons li { display: list-item; border: 0; padding: 0; }
  #toast { position: fixed; right: 16px; bottom: 16px; max-width: min(420px, calc(100vw - 32px)); background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: 8px; display: none; }
  @media (max-width: 480px) { header, main { padding-left: 16px; padding-right: 16px; } dl { grid-template-columns: 96px 1fr; } }
</style>
</head>
<body>
<header>
  <h1>Kuasa Console</h1>
  <span class="sub">Mandates for AI shopping agents, read live from Concordium testnet</span>
  <span class="sub mono" id="contracts"></span>
</header>
<main>
  <section><h2>Mandates (on-chain)</h2><div id="mandates" class="muted">Loading…</div></section>
  <section><h2>Kuasa Cover · claims queue</h2><div id="claims" class="muted">Loading…</div></section>
  <section><h2>Kuasa Cover · policies &amp; pool</h2><div id="cover" class="muted">Loading…</div></section>
  <section><h2>Merchant decisions (live)</h2><ul id="feed" class="feed"><li class="muted">Loading…</li></ul></section>
  <section><h2>Trust receipts</h2><div id="receipts" class="muted">No purchases yet.</div></section>
</main>
<div id="toast" role="status" aria-live="polite"></div>
<script>
const $ = (id) => document.getElementById(id);
let unit = 'EUDemo';
const ccd = (v) => (Number(v) / 1e6).toLocaleString(undefined, { maximumFractionDigits: 2 }) + ' ' + esc(unit);
const short = (s) => s ? esc(String(s).slice(0, 8) + '…' + String(s).slice(-6)) : '';
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let explorer = '';
const safeUrl = (u) => { try { const p = new URL(u).protocol; return p === 'https:' || p === 'http:' ? esc(u) : '#'; } catch { return '#'; } };
const hex = (h) => /^[0-9a-f]{64}$/i.test(h ?? '') ? h : '';
const b58 = (a) => /^[1-9A-HJ-NP-Za-km-z]{45,55}$/.test(a ?? '') ? a : '';
const tx = (h) => hex(h) ? `<a class="mono" target="_blank" rel="noopener" href="${safeUrl(explorer)}/transaction/${hex(h)}">${short(h)}</a>` : '';
const acct = (a) => !b58(a) ? '' : `<a class="mono" target="_blank" rel="noopener" href="${safeUrl(explorer)}/account/${a}">${short(a)}</a>`;

function toast(msg) { const t = $('toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = 'none', 6000); }

async function act(kind, name, btn) {
  if (kind === 'revoke' && !confirm(`Revoke ${name}'s mandate? This is permanent and applies to every merchant immediately.`)) return;
  btn.disabled = true; btn.textContent = 'Submitting…';
  try {
    const r = await (await fetch(`/api/${kind}/${name}`, { method: 'POST', headers: { 'x-kuasa-console': '1' } })).json();
    const label = { revoke: 'Revoked', incident: 'Incident filed', 'publish-cover': 'Cover status published to the agent registry' }[kind];
    toast(r.error ? `Failed: ${r.error}` : `${label} · tx ${short(r.tx)}`);
  } finally { refresh(); }
}

async function post(path, btn, okText) {
  btn.disabled = true; btn.textContent = 'Submitting…';
  try {
    const r = await (await fetch(path, { method: 'POST', headers: { 'x-kuasa-console': '1' } })).json();
    toast(r.error ? `Failed: ${r.error}` : r.reason ? r.reason : okText(r));
  } finally { refresh(); }
}
const decide = (id, verdict, btn) => {
  if (verdict === 'approve' && !confirm(`Approve claim #${id}? The payout is sent from the insurer pool.`)) return;
  post(`/api/claims/${id}/decision/${verdict}`, btn, (r) => r.paid ? `Paid · tx ${short(r.paid)}` : 'Decision recorded');
};
const assessPending = (id, btn) => post(`/api/claims/${id}/assess`, btn, (r) => `Assessed: ${r.reason}`);
const approveDisclosure = (id, btn) => {
  if (!confirm(`Anchor a lawful-disclosure request for claim #${id}? It names the claimant account for the identity provider / Privacy Guardians process.`)) return;
  post(`/api/disclosures/${id}/approve`, btn, (r) => `Disclosure request anchored · ${short(r.hash)}`);
};

function claimStatus(c, pendingIds) {
  if (c.paid) return ['ok', c.recordPending ? 'Paid · record pending' : 'Paid'];
  if (pendingIds.includes(String(c.claimId))) return ['warn', 'Needs assessment'];
  if (c.decided && c.assessment.ok) return ['warn', 'Approved · payout pending'];
  if (c.decided) return ['bad', 'Rejected'];
  return c.assessment.ok ? ['warn', 'Awaiting your decision'] : ['bad', 'Assessed: not covered'];
}

function renderClaims(cv) {
  if (!cv || cv.offline) return '<span class="muted">Insurer offline (start packages/insurer).</span>';
  const pendingIds = (cv.pendingAssessments ?? []).map((p) => String(p.claimId));
  const rows = cv.claims.slice().reverse().map((c) => {
    const st = claimStatus(c, pendingIds);
    const open = !c.decided && !c.paid && c.assessment.ok;
    const retry = c.decided && c.assessment.ok && (!c.paid || c.recordPending);
    return `<div class="card">
      <div class="row"><span class="name">Claim #${esc(c.claimId)}</span><span class="pill ${st[0]}">${st[1]}</span></div>
      <dl>
        <dt>Assessment</dt><dd>${esc(c.assessment.reason)}</dd>
        <dt>Payout</dt><dd>${ccd(c.assessment.payout)} to ${acct(c.recipient)}</dd>
        <dt>Evidence</dt><dd>${c.receiptTxs.map((t) => tx(t)).join(' · ') || '–'}</dd>
        ${c.paid ? `<dt>Paid</dt><dd>${tx(c.paid)}</dd>` : ''}
      </dl>
      ${open ? `<div class="row" style="justify-content:flex-start">
        <button onclick="decide('${esc(c.claimId)}','approve',this)">Approve &amp; pay</button>
        <button class="danger" onclick="decide('${esc(c.claimId)}','reject',this)">Reject</button></div>` : ''}
      ${retry ? `<button onclick="decide('${esc(c.claimId)}','approve',this)">Retry payout</button>` : ''}
    </div>`;
  }).join('');
  const pend = (cv.pendingAssessments ?? []).map((p) => `<div class="card"><div class="row"><span class="name">Claim #${esc(p.claimId)}</span><span class="pill warn">Filed, not assessed</span></div>
    <p class="muted">${esc(p.error)}</p><button onclick="assessPending('${esc(p.claimId)}',this)">Assess now</button></div>`).join('');
  const disc = (cv.pendingDisclosures ?? []).map((d) => `<div class="card"><div class="row"><span class="name">Disclosure draft · claim #${esc(d.claimId)}</span><span class="pill bad">Repeated no-evidence claims</span></div>
    <dl><dt>Account</dt><dd>${acct(d.account)}</dd></dl>
    <button class="danger" onclick="approveDisclosure('${esc(d.claimId)}',this)">Review &amp; anchor request</button></div>`).join('');
  const done = (cv.disclosures ?? []).map((d) => `<li><span class="muted mono">claim ${esc(d.claimId)}</span><div>Lawful-disclosure request anchored for ${acct(d.account)} · <span class="mono">${short(d.hash)}</span></div></li>`).join('');
  const body = pend + disc + rows;
  return (body || '<span class="muted">No claims yet.</span>') + (done ? `<ul class="feed">${done}</ul>` : '');
}

function renderCover(cv, mandates) {
  if (!cv || cv.offline) return '<span class="muted">Insurer offline.</span>';
  const who = Object.fromEntries(mandates.map((m) => [m.payer, m.name]));
  const paidOut = cv.payouts.reduce((a, p) => a + Number(p.amount), 0);
  const warn = cv.unissued.length ? `<p class="pill bad">${cv.unissued.length} premium(s) paid but policy not issued yet (retrying)</p>` : '';
  const pols = cv.policies.slice().reverse().map((p) => `<li><span class="mono">#${esc(p.policyId)}</span><div>
    <strong>${esc(who[p.payer] ?? short(p.payer))}</strong> · ${esc(p.kind)} cover up to ${ccd(p.limit)} · until ${new Date(Number(p.until)).toLocaleDateString()}<br>
    premium ${tx(p.premiumTx)}</div></li>`).join('');
  return `${warn}<dl>
      <dt>Pool</dt><dd>${cv.pool == null ? 'balance unavailable' : ccd(cv.pool)} in treasury ${acct(cv.treasury)}</dd>
      <dt>Premiums in</dt><dd>${ccd(cv.premiumsIn)}</dd>
      <dt>Payouts out</dt><dd>${ccd(paidOut)} (${cv.payouts.length})</dd>
      <dt>Contract</dt><dd class="mono">${esc(cv.cover)}</dd>
    </dl>${pols ? `<ul class="feed">${pols}</ul>` : '<span class="muted">No policies yet.</span>'}`;
}

function renderMandate(m) {
  const e = m.entry, d = m.doc;
  if (!e) return `<div class="card"><div class="name">${esc(m.name)}</div><p class="muted">Not found on-chain.</p></div>`;
  const expired = Number(e.validUntilMs) < Date.now();
  const status = e.revoked ? ['bad', 'Revoked'] : expired ? ['warn', 'Expired'] : ['ok', 'Active'];
  const pct = Math.min(100, Number(e.spent) * 100 / Number(e.maxTotal));
  return `<div class="card">
    <div class="row"><span class="name">${esc(m.name)}'s agent</span><span class="pill ${status[0]}">${status[1]}</span></div>
    <dl>
      <dt>Budget</dt><dd>${ccd(e.spent)} of ${ccd(e.maxTotal)}<div class="bar"><i style="width:${pct}%"></i></div></dd>
      <dt>Per order</dt><dd>${d ? ccd(d.scope.maxPerOrder) : '–'}</dd>
      <dt>Categories</dt><dd>${d ? d.scope.categories.map(esc).join(', ') : '–'}</dd>
      <dt>Valid until</dt><dd>${new Date(Number(e.validUntilMs)).toLocaleDateString()}</dd>
      <dt>Owner</dt><dd>${acct(e.owner)}</dd>
      <dt>Agent pays from</dt><dd>${acct(e.payer)}</dd>
      <dt>Agent registry</dt><dd class="mono">CIS-8004 &lt;12802,0&gt; token ${esc(m.agentToken)}</dd>
      <dt>ZK proof</dt><dd>${d ? `<a target="_blank" rel="noopener" href="${safeUrl(d.proof.auditRecordUri)}">audit record</a> · anchor ${tx(m.proofAnchorTx)}` : '–'}</dd>
      <dt>Activity</dt><dd>${e.receipts} receipt(s) · ${e.incidents} incident(s) · issued ${tx(m.issueTx)}</dd>
      <dt>Insured</dt><dd>${m.coverStatus ? `<span class="pill ok">Kuasa Cover</span> <span class="mono">${esc(m.coverStatus)}</span>` : '<span class="muted">not published in the agent registry</span>'}</dd>
    </dl>
    <div class="row" style="justify-content:flex-start">
      <button class="danger" ${e.revoked ? 'disabled' : ''} onclick="act('revoke','${esc(m.name)}',this)">Revoke mandate</button>
      <button onclick="act('incident','${esc(m.name)}',this)">Report incident</button>
      <button onclick="act('publish-cover','${esc(m.name)}',this)">Publish cover status</button>
    </div>
  </div>`;
}

function renderFeed(log, mandates) {
  const who = Object.fromEntries(mandates.map((m) => [m.id, m.name]));
  if (!log.length) return '<li class="muted">No purchase attempts yet.</li>';
  return log.slice().reverse().map((l) => {
    const d = l.decision, t = new Date(l.at).toLocaleTimeString();
    const name = who[l.mandate] ?? (l.mandate ? short(l.mandate) : 'unknown agent');
    return `<li><span class="muted mono">${t}</span><div>
      <span class="pill ${d.ok ? 'ok' : 'bad'}">${d.ok ? 'Allowed' : 'Refused before payment'}</span>
      <strong>${esc(name)}</strong> · ${l.amount ? ccd(l.amount) : ''}
      ${d.ok ? '' : `<ul class="reasons">${d.reasons.map((r) => `<li>${esc(r)}</li>`).join('')}</ul>`}
    </div></li>`;
  }).join('');
}

function renderReceipts(receipts, mandates) {
  const who = Object.fromEntries(mandates.map((m) => [m.id, m.name]));
  if (!receipts.length) return '<span class="muted">No purchases yet.</span>';
  return `<ul class="feed">${receipts.slice().reverse().map((r) => `<li><span class="mono">${(Number(r.amount) / 1e6).toLocaleString()}<br><span class="muted">${esc(unit)}</span></span><div>
    <strong>${esc(who[r.mandate] ?? short(r.mandate))}</strong><br>
    payment ${tx(r.paymentTx)} · receipt ${tx(r.receiptTx)}<br><span class="muted mono">order ${short(r.order)}</span></div></li>`).join('')}</ul>`;
}

async function refresh() {
  try {
    const s = await (await fetch('/api/state')).json();
    explorer = s.explorer;
    unit = s.mandates.find((m) => m.doc)?.doc.scope.asset ?? unit;
    $('contracts').textContent = `registry ${s.registry} · agents ${s.agentRegistry}`;
    $('mandates').innerHTML = s.mandates.map(renderMandate).join('');
    $('feed').innerHTML = s.shop ? renderFeed(s.shop.log, s.mandates) : '<li class="muted">Shop offline (start packages/shop).</li>';
    $('receipts').innerHTML = s.shop ? renderReceipts(s.shop.receipts, s.mandates) : '';
    const cv = await (await fetch('/api/cover')).json().catch(() => null);
    $('claims').innerHTML = renderClaims(cv);
    $('cover').innerHTML = renderCover(cv, s.mandates);
  } catch (e) { $('mandates').textContent = 'Console API unreachable.'; }
}
refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
