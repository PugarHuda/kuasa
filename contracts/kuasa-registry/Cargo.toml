[package]
name = "kuasa-registry"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Kuasa: on-chain registry of scoped, revocable purchasing mandates for AI agents"

[features]
default = []
bump_alloc = ["concordium-std/bump_alloc"]

[dependencies]
concordium-std = "11.0"

[dev-dependencies]
concordium-smart-contract-testing = "5"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = "s"
codegen-units = 1
